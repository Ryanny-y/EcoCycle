services:
  backend:
    build: .
    container_name: ecocycle-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: ecocycle-db
    environment:
      POSTGRES_DB: ecocycle_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

volumes:
  postgres_data:
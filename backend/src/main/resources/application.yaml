server:
  port: 8080

spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ecocycle_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

# JWT
jwt:
  secretKey: ${JWT_SECRET_KEY}
  accessTokenExp: ${JWT_ACCESS_TOKEN_EXP}
  refreshTokenExp: ${JWT_REFRESH_TOKEN_EXP}
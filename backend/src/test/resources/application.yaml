server:
  port: 8080

spring:
  application:
    name: backend

  datasource:
    url: jdbc:h2:mem:test_db;MODE=PostgreSQL
    username: test
    password: test_password
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  secretKey: secretKey
  accessTokenExp: 10000
  refreshTokenExp: 100000

aws:
  access-key: Access
  secret-key: key
  region: ap-southeast-1
  bucket-name: ecocycle-storage-tests

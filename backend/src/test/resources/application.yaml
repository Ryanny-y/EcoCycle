server:
  port: 8080

spring:
  application:
    name: backend

  datasource:
    url: jdbc:h2:mem:test_db;MODE=PostgreSQL
    username: test
    password: test_password
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  flyway:
    enabled: true
    locations: classpath:db/test-migration

jwt:
  secretKey: secretKey
  accessTokenExp: 10000
  refreshTokenExp: 100000

aws:
  access-key: Access
  secret-key: key
  region: ap-southeast-1
  bucket-name: ecocycle-storage-tests
